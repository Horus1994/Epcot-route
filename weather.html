<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPCOT Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  :root { --page:#ffffff; --sky1:#38bdf8; --sky2:#60caf9; --ink:#0f172a; --night:#0f172a; --night-ink:#e8edf5; --night-dim:#94a3b8; --line:#1e293b; --wet:#7dd3fc; }
  @media (prefers-color-scheme: dark) { :root { --page:#191919; } }
  html.force-dark  { --page:#191919; }
  html.force-light { --page:#ffffff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--page); }
  body { font-family: "Source Sans 3", "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: var(--ink); }
  .wrap { display: flex; justify-content: center; padding: 8px; }
  .card { width: 100%; max-width: 420px; border-radius: 16px; overflow: hidden; box-shadow: 0 18px 40px rgba(31,41,55,.14); background: var(--night); }

  /* top: current conditions on the sky gradient */
  .top { background: linear-gradient(160deg, var(--sky1), var(--sky2)); padding: 16px 20px 12px; color: var(--ink); }
  .loc { text-align: center; font-size: 14px; font-weight: 600; letter-spacing: .01em; }
  .now { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 4px; }
  .temp { font-size: 46px; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
  .ico { font-size: 44px; line-height: 1; }
  .status { font-size: 14px; font-weight: 600; text-align: right; max-width: 120px; line-height: 1.2; }

  /* stats row */
  .stats { display: flex; justify-content: space-around; background: var(--night); color: var(--night-ink); padding: 10px 8px; font-size: 13px; }
  .stats span { display: inline-flex; align-items: center; gap: 6px; }
  .stats i { font-style: normal; opacity: .85; }

  /* hourly strip */
  .hours-wrap { position: relative; background: var(--night); padding: 4px 0 12px; }
  .hours { display: flex; gap: 2px; overflow-x: auto; scroll-behavior: smooth; padding: 0 30px; scrollbar-width: none; }
  .hours::-webkit-scrollbar { display: none; }
  .h { flex: 0 0 auto; width: 54px; text-align: center; color: var(--night-ink); display: grid; gap: 4px; justify-items: center; padding: 6px 0; }
  .h .t { font-size: 12px; color: var(--night-dim); }
  .h .i { font-size: 20px; line-height: 1; }
  .h .d { font-size: 13px; font-weight: 600; }
  .arrow { position: absolute; top: 50%; transform: translateY(-40%); width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(148,163,184,.18); color: var(--night-ink); font-size: 14px; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .arrow:hover { background: rgba(148,163,184,.32); }
  .arrow.l { left: 6px; } .arrow.r { right: 6px; }

  /* weekly forecast */
  .week { background: var(--night); border-top: 1px solid var(--line); padding: 6px 16px 14px; }
  .row { display: grid; grid-template-columns: 52px 26px 44px 1fr; align-items: center; gap: 8px; padding: 7px 0; color: var(--night-ink); font-size: 14px; }
  .row + .row { border-top: 1px solid rgba(148,163,184,.10); }
  .row .n { font-weight: 600; }
  .row .i { font-size: 18px; text-align: center; line-height: 1; }
  .row .p { font-size: 12px; color: var(--night-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .p.wet { color: var(--wet); font-weight: 600; }
  .rng { display: grid; grid-template-columns: 34px 1fr 34px; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .rng .lo { color: var(--night-dim); text-align: right; }
  .rng .hi { font-weight: 600; }
  .bar { position: relative; height: 5px; border-radius: 3px; background: rgba(148,163,184,.22); }
  .bar b { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #38bdf8, #fbbf24); }
  .msg { padding: 24px 20px; color: var(--night-ink); font-size: 14px; text-align: center; }
  @media (max-width: 380px) { .row { grid-template-columns: 44px 22px 40px 1fr; gap: 6px; font-size: 13px; } .top { padding-inline: 14px; } }
</style>
<script>
  (function () {
    var m = /[?&]theme=(dark|light)/.exec(location.search);
    if (m) document.documentElement.className = 'force-' + m[1];
  })();
</script>
</head>
<body>
<div class="wrap">
  <div class="card" id="card"><div class="msg">Loading forecast…</div></div>
</div>
<script>
(function () {
  var URL = "https://api.open-meteo.com/v1/forecast?latitude=28.375&longitude=-81.549" +
    "&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m" +
    "&hourly=temperature_2m,weather_code,precipitation_probability" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
    "&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FNew_York&forecast_days=7";
  var ICON = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',56:'🌧️',57:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',66:'🌧️',67:'🌧️',71:'❄️',73:'❄️',75:'❄️',77:'❄️',80:'🌦️',81:'🌧️',82:'🌧️',85:'❄️',86:'❄️',95:'⛈️',96:'⛈️',99:'⛈️'};
  var TEXT = {0:'Clear sky',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',56:'Freezing drizzle',57:'Freezing drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Rain showers',81:'Rain showers',82:'Heavy showers',85:'Snow showers',86:'Snow showers',95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};
  var DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function ic(c){ return ICON[c] || '🌡️'; }
  function hr(d){ var h = d.getHours(), ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ' ' + ap; }
  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

  function render(j) {
    var c = j.current, H = j.hourly, D = j.daily;
    var nowIso = c.time;                       // "YYYY-MM-DDTHH:MM" local
    var start = 0;
    for (var k = 0; k < H.time.length; k++) { if (H.time[k] >= nowIso.slice(0,13) + ':00') { start = k; break; } }
    var out = '';
    out += '<div class="top"><div class="loc">EPCOT · Lake Buena Vista, FL</div>' +
           '<div class="now"><div class="temp">' + Math.round(c.temperature_2m) + '°F</div>' +
           '<div class="ico">' + ic(c.weather_code) + '</div>' +
           '<div class="status">' + esc(TEXT[c.weather_code] || 'Conditions') + '</div></div></div>';
    out += '<div class="stats"><span><i>💨</i>' + Math.round(c.wind_speed_10m) + ' mph</span>' +
           '<span><i>💧</i>' + Math.round(c.relative_humidity_2m) + '% humidity</span>' +
           '<span><i>☔</i>' + Math.round(D.precipitation_probability_max[0] || 0) + '% rain today</span></div>';
    out += '<div class="hours-wrap"><button class="arrow l" aria-label="Earlier" id="hl">‹</button><div class="hours" id="hrs">';
    for (var n = start; n < Math.min(start + 24, H.time.length); n++) {
      var d = new Date(H.time[n]);
      out += '<div class="h"><div class="t">' + (n === start ? 'Now' : hr(d)) + '</div><div class="i">' + ic(H.weather_code[n]) + '</div><div class="d">' + Math.round(H.temperature_2m[n]) + '°</div></div>';
    }
    out += '</div><button class="arrow r" aria-label="Later" id="hr">›</button></div>';
    var gmin = Math.min.apply(null, D.temperature_2m_min), gmax = Math.max.apply(null, D.temperature_2m_max), span = Math.max(gmax - gmin, 1);
    out += '<div class="week">';
    for (var i = 0; i < D.time.length; i++) {
      var p = D.time[i].split('-'), dt = new Date(+p[0], +p[1] - 1, +p[2]);
      var lo = D.temperature_2m_min[i], hi = D.temperature_2m_max[i], rain = Math.round(D.precipitation_probability_max[i] || 0);
      var left = ((lo - gmin) / span * 100).toFixed(1), width = Math.max(((hi - lo) / span * 100), 6).toFixed(1);
      out += '<div class="row"><div class="n">' + (i === 0 ? 'Today' : DAYS[dt.getDay()]) + '</div><div class="i">' + ic(D.weather_code[i]) + '</div>' +
             '<div class="p' + (rain >= 50 ? ' wet' : '') + '">💧' + rain + '%</div>' +
             '<div class="rng"><span class="lo">' + Math.round(lo) + '°</span><div class="bar"><b style="left:' + left + '%;width:' + width + '%"></b></div><span class="hi">' + Math.round(hi) + '°</span></div></div>';
    }
    out += '</div>';
    document.getElementById('card').innerHTML = out;
    var hrs = document.getElementById('hrs');
    document.getElementById('hl').onclick = function () { hrs.scrollBy({ left: -216 }); };
    document.getElementById('hr').onclick = function () { hrs.scrollBy({ left: 216 }); };
  }

  function load(retry) {
    fetch(URL).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) { if (!j.daily || !j.current) throw new Error('no forecast in response'); render(j); })
      .catch(function (e) {
        if (retry) { setTimeout(function () { load(false); }, 1500); return; }
        document.getElementById('card').innerHTML = '<div class="msg">Forecast unavailable (' + esc(e && e.message ? e.message : 'error') + '). Reload to try again.</div>';
      });
  }
  load(true);
})();
</script>
</body>
</html>
